# sema_seed_request.yaml
#
# Seed request for bruce's vendored Sema snapshot (src/bruce/sema): the
# words bruce speaks across the FLO boundary, in and out, so a request is
# decoded and a recommendation encoded through sema's generated classes
# rather than hand-built dicts. Regenerate from the sema repo with:
#
#   scripts/regen_sema_snapshot.sh
#
# (one call to `sema snapshot regen` on this file; `package_name` and
# `vendor_dir` below say where the snapshot goes).
#
# Every word is pinned to ONE version, the version bruce speaks; `{}`
# (registry latest) is never used, so a dependency closure cannot bring a
# second version of a word in behind the pinned one. The tuning words,
# flo.optimal.path, price.quantity.unitless and the enums and formats
# arrive through the closure of the two roots.

package_name: bruce
vendor_dir: sema

# No `staging` block: bruce is deployed from main and its snapshot holds
# published words only; a staging word the closure reaches fails the build.
# The snapshot's check_staging.py (run by ci.sh) fails on any staging word
# the snapshot holds. A dev-only build of a staging version adds
# `staging: {allow: [word]}` on its branch, where the PR diff shows it.

local_names:
  strip_prefixes: [gw1, gw]

initial_targets:
  types:
    flo.params:
      versions: ["004"]
    flo.recommendation:
      versions: ["003"]
    # Body of POST …/flo.rerun.
    flo.rerun.request:
      versions: ["000", "001", "002"]
