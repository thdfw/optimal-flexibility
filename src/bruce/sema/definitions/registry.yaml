metadata:
  registry_version: "1.0"
  last_updated: "2026-11-24T11:20:00Z"
  maintainer: "gridworks-energy"

formats:
  git.commit:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/git.commit"
    created: "2026-10-08T21:00:00Z"
    status: "published"
    description: "A git commit identifying running code: a 40-character lowercase git hash, suffixed -dirty when the working tree had uncommitted changes"

  left.right.dot:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/left.right.dot"
    created: "2022-01-01T00:00:00Z"
    status: "published"
    description: "Dot-separated hierarchical identifier composed of lowercase alphanumeric segments"

  non.empty.string:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/non.empty.string"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "String with at least one character"

  non.negative.int:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/non.negative.int"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "Non-negative integer with non-coercive serialized validation"

  positive.int:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/positive.int"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "Positive integer with non-coercive serialized validation"

  utc.milliseconds:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/utc.milliseconds"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "UTC timestamp in whole milliseconds since Unix epoch (2000–3000 range)"

  utc.seconds:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/utc.seconds"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "UTC timestamp in whole seconds since Unix epoch (2000–3000 range)"

  uuid4.str:
    owner: gridworks-energy
    schema_url: "https://schemas.electricity.works/formats/uuid4.str"
    created: "2024-09-02T15:00:00Z"
    status: "published"
    description: "Canonical lowercase UUIDv4 string (RFC 4122) in 8-4-4-4-12 format"

enums:
  gw1.seasonal.storage.mode:
    latest_version: "000"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Seasonal storage operating mode for layouts that distinguish all-tank from buffer-only operation."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/gw1.seasonal.storage.mode/000"
        created: "2026-01-14T18:04:00Z"
        status: "published"

  market.price.unit:
    latest_version: "000"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Unit of the price axis for a market type."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/market.price.unit/000"
        created: "2024-12-05T19:25:00Z"
        status: "published"

  market.quantity.unit:
    latest_version: "000"
    owner: gridworks-energy
    enum_type: "versioned"
    description: "Unit of the quantity axis for a market type."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/enums/market.quantity.unit/000"
        created: "2024-12-05T19:25:00Z"
        status: "published"

types:
  flo.optimal.path:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "A FLO's expected operating path over its horizon for one first-step electricity choice: heat pump average power and store energy per step."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/flo.optimal.path/000"
        created: "2026-11-01T15:20:00Z"
        status: "published"
        summary: "StartUnixS, StepDurationMinutes, HpAvgWList (W), StoreWhList (Wh); axiom StepListLengths."
        direct_dependencies:
          structural:
            - "positive.int"
            - "utc.seconds"

  flo.params:
    latest_version: "004"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "One request to a FLO for one market slot: bidder, step grid, price and weather forecasts, the modeled store and its state, heat pump facts, market price bounds, and the tuning whose TypeName names the optimizer."

    versions:
      "004":
        schema_url: "https://schemas.electricity.works/types/flo.params/004"
        created: "2026-11-19T14:00:00Z"
        status: "published"
        summary: "- Tuning: flo.tuning.bruce 002 -> 003"
        direct_dependencies:
          structural:
            - "flo.optimal.path:000"
            - "flo.tuning.alice:000"
            - "flo.tuning.bruce:003"
            - "gw1.seasonal.storage.mode:000"
            - "left.right.dot"
            - "positive.int"
            - "utc.milliseconds"
            - "utc.seconds"
            - "uuid4.str"
      "003":
        schema_url: "https://schemas.electricity.works/types/flo.params/003"
        created: "2026-11-18T10:05:00Z"
        status: "published"
        summary: "- Tuning: flo.tuning.bruce 001 -> 002"
        direct_dependencies:
          structural:
            - "flo.optimal.path:000"
            - "flo.tuning.alice:000"
            - "flo.tuning.bruce:002"
            - "gw1.seasonal.storage.mode:000"
            - "left.right.dot"
            - "positive.int"
            - "utc.milliseconds"
            - "utc.seconds"
            - "uuid4.str"
      "002":
        schema_url: "https://schemas.electricity.works/types/flo.params/002"
        created: "2026-11-13T00:25:00Z"
        status: "published"
        summary: "- PriceUsdMwhList: add, in place of LmpUsdMwhList and DistUsdMwhList - PriceForecastId: add"
        direct_dependencies:
          structural:
            - "flo.optimal.path:000"
            - "flo.tuning.alice:000"
            - "flo.tuning.bruce:001"
            - "gw1.seasonal.storage.mode:000"
            - "left.right.dot"
            - "positive.int"
            - "utc.milliseconds"
            - "utc.seconds"
            - "uuid4.str"
      "001":
        schema_url: "https://schemas.electricity.works/types/flo.params/001"
        created: "2026-11-02T17:45:00Z"
        status: "published"
        summary: "- Tuning: flo.tuning.bruce 000 -> 001, NumLayers assigned as TanksModeled times TempSensorsPerTank"
        direct_dependencies:
          structural:
            - "flo.optimal.path:000"
            - "flo.tuning.alice:000"
            - "flo.tuning.bruce:001"
            - "gw1.seasonal.storage.mode:000"
            - "left.right.dot"
            - "positive.int"
            - "utc.milliseconds"
            - "utc.seconds"
            - "uuid4.str"

  flo.path.penalties.bruce:
    latest_version: "002"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "The penalties the bruce optimizer charged along one flo.optimal.path, per step, and the cost it assigned to the path's final state."

    versions:
      "002":
        schema_url: "https://schemas.electricity.works/types/flo.path.penalties.bruce/002"
        created: "2026-11-19T13:55:00Z"
        status: "published"
        summary: "- Experimental: add, an open container for penalty series under tuning - UnmetLoadPenaltyUsdList: move into Experimental"
        direct_dependencies:
          structural: []

  flo.recommendation:
    latest_version: "003"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "A FLO's answer to one flo.params request: the bid curve to submit for the slot and, per price-quantity pair, the optimal path that quantity leads to, with the FLO's provenance."

    versions:
      "003":
        schema_url: "https://schemas.electricity.works/types/flo.recommendation/003"
        created: "2026-11-19T14:00:00Z"
        status: "published"
        summary: "- PathPenaltiesList: flo.path.penalties.bruce 001 -> 002"
        direct_dependencies:
          structural:
            - "flo.optimal.path:000"
            - "flo.path.penalties.bruce:002"
            - "flo.tank.store.path:000"
            - "git.commit"
            - "left.right.dot"
            - "market.price.unit:000"
            - "market.quantity.unit:000"
            - "non.empty.string"
            - "price.quantity.unitless:001"
            - "utc.milliseconds"

  flo.rerun.request:
    latest_version: "002"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Request to re-solve one market slot: the flo.params (possibly edited), and which horizon steps force the heat pump on or off."

    versions:
      "002":
        schema_url: "https://schemas.electricity.works/types/flo.rerun.request/002"
        created: "2026-11-19T14:05:00Z"
        status: "published"
        summary: "- Params: flo.params 004 joins the union; a 003 is lifted to 004"
        direct_dependencies:
          structural:
            - "flo.params:001"
            - "flo.params:002"
            - "flo.params:003"
            - "flo.params:004"
            - "non.negative.int"
      "001":
        schema_url: "https://schemas.electricity.works/types/flo.rerun.request/001"
        created: "2026-11-18T10:10:00Z"
        status: "published"
        summary: "- Params: a flo.params 002 is lifted to 003, its unmet-load penalty off"
        direct_dependencies:
          structural:
            - "flo.params:001"
            - "flo.params:002"
            - "flo.params:003"
            - "non.negative.int"
      "000":
        schema_url: "https://schemas.electricity.works/types/flo.rerun.request/000"
        created: "2026-11-16T14:00:00Z"
        status: "published"
        summary: "Params (oneOf flo.params 001, 002), HpForcedOnSteps and HpForcedOffSteps (non.negative.int, 0 is first step); axioms ForcedStepsWithinHorizon, ForcedOnOffDisjoint."
        direct_dependencies:
          structural:
            - "flo.params:001"
            - "flo.params:002"
            - "non.negative.int"

  flo.tank.store.path:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "The state of a store of stratified water tanks at the end of each step of one flo.optimal.path: layer count, the three band temperatures and the two thermoclines as layer indices."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/flo.tank.store.path/000"
        created: "2026-11-09T20:20:00Z"
        status: "published"
        summary: "StoreLayers, TopFList, MiddleFList, BottomFList (F), Thermocline1List, Thermocline2List (layer index from the top), EmptyStoreWh, FullStoreWh; axioms StepListLengths, ThermoclinesWithinTheStore, EmptyBelowFull."
        direct_dependencies:
          structural:
            - "positive.int"

  flo.tuning.alice:
    latest_version: "000"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Tuning of the alice FLO, which has none; naming it in operational params means no optimizer runs."

    versions:
      "000":
        schema_url: "https://schemas.electricity.works/types/flo.tuning.alice/000"
        created: "2026-11-01T16:25:00Z"
        status: "published"
        summary: "TypeName and Version only."
        direct_dependencies:
          structural: []

  flo.tuning.bruce:
    latest_version: "003"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Tuning knobs of the bruce FLO: plant model constants no house word states, the store model's layer count, and its penalty weights."

    versions:
      "003":
        schema_url: "https://schemas.electricity.works/types/flo.tuning.bruce/003"
        created: "2026-11-19T13:55:00Z"
        status: "published"
        summary: "- Experimental: add, an open container for knobs under tuning - UnmetLoadPenaltyEnabled, UnmetLoadPenaltyWeight: move into Experimental"
        direct_dependencies:
          structural:
            - "non.negative.int"
            - "positive.int"
      "002":
        schema_url: "https://schemas.electricity.works/types/flo.tuning.bruce/002"
        created: "2026-11-18T10:00:00Z"
        status: "published"
        summary: "- UnmetLoadPenaltyEnabled: add, assigned false - UnmetLoadPenaltyWeight: add, assigned 10"
        direct_dependencies:
          structural:
            - "non.negative.int"
            - "positive.int"
      "001":
        schema_url: "https://schemas.electricity.works/types/flo.tuning.bruce/001"
        created: "2026-11-02T17:45:00Z"
        status: "published"
        summary: "- NumLayers: add"
        direct_dependencies:
          structural:
            - "non.negative.int"
            - "positive.int"

  price.quantity.unitless:
    latest_version: "001"
    owner: gridworks-energy
    versioning_strategy: "literal"
    description: "Integer price and quantity pair for market bidding and dispatch curves, with both values serialized at x1000 scaling."

    versions:
      "001":
        schema_url: "https://schemas.electricity.works/types/price.quantity.unitless/001"
        created: "2025-10-30T17:29:00Z"
        status: "published"
        summary: "Rename PriceTimes1000/QuantityTimes1000 to PriceX1000/QuantityX1000."
        direct_dependencies:
          structural: []
