[project]
name = "bruce-energy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydantic>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bruce"]

[tool.pyright]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
